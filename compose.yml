# Deployed to /opt/apps/ipos/compose.yml alongside its .env.
# Traefik lives in /opt/platform and owns TLS and the public ports; nothing
# here publishes a port to the host.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Deliberately off the proxy network: the database is not a web service.

  api:
    image: ghcr.io/chanchhay/sb-ite-basic-course-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PGHOST: db
      PGPORT: 5432
    networks:
      - internal   # reaches db
      - proxy      # reachable by Traefik
    labels:
      - "traefik.enable=true"
      # Scoped to the proxy network: with two networks attached, Traefik has to
      # be told which address to route to.
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.ipos-api.rule=Host(`api.fluxibiz.store`)"
      - "traefik.http.routers.ipos-api.entrypoints=websecure"
      - "traefik.http.routers.ipos-api.tls=true"
      - "traefik.http.routers.ipos-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ipos-api.service=ipos-api"

      # The container port, not a host port — nothing is published.
      - "traefik.http.services.ipos-api.loadbalancer.server.port=8080"

      # WebSocket upgrades pass through a Traefik router untouched, so the
      # STOMP endpoint needs no extra middleware.

networks:
  internal:
    driver: bridge
  proxy:
    external: true

volumes:
  pgdata:
