spring:
  scalar:
    url: ${SERVER_URL:localhost://8080}/v3/api-docs
    path: /docs
    enabled: true

  application:
    name: ite-sb-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:1681}/${PGDATABASE:fluxibix}
    username: ${DB_USER}
    password: ${DB_PASS}

keycloak:
  admin:
    server-url: ${KEYCLOAK_URL}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    realm: master
    target-realm: ${TARGET_REALM}
    send-verification-email: false

app:
  storefront:
    base-domain: ${BASE_STOREFRONT_DOMAIN}
    protocol: https
    path-prefix: /store
    subdomain-enabled: true
  security:
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:}

  telegram:
    api-base-url: https://api.telegram.org
    webhook-base-url: ${TELEGRAM_WEBHOOK_BASE_URL:}
    payment-poll-interval-ms: 5000
    payment-poll-initial-delay-ms: 10000

  bakong:
    base-url: https://api-bakong.nbc.gov.kh
    timeout: 8s

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket:
    assets: fluxibix