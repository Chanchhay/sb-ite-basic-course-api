server:
  max-http-request-header-size: 64KB
  tomcat:
    # An item save carries a part per field plus one per picture, which is
    # already past Tomcat's default of 10.
    max-part-count: 64

spring:
  scalar:
    url: ${SERVER_URL:http://localhost:8080}/v3/api-docs
    path: /docs
    enabled: true

  application:
    name: ite-sb-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:https://auth.chanchhay.site/realms/istad-fluxipos-auth}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:1681}/${PGDATABASE:fluxibix}
    username: ${DB_USER}
    password: ${DB_PASS}

keycloak:
  admin:
    server-url: ${KEYCLOAK_URL}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    realm: master
    target-realm: ${TARGET_REALM}
    send-verification-email: true

app:
  cors:
    allowed-origin-patterns:
      - "http://localhost:[*]"
      - "http://127.0.0.1:[*]"
      - "https://www.fluxibiz.store"
      - "https://*.fluxibiz.store"
      - "https://fluxibiz.store"
      - "https://administrator.fluxibiz.store"
      - "https://*.ngrok-free.dev"
      - "https://*.ngrok-free.app"
  storefront:
    base-domain: ${BASE_STOREFRONT_DOMAIN:fluxibiz.store}
    protocol: ${STOREFRONT_PROTOCOL:https}
    path-prefix: /store
    subdomain-enabled: ${STOREFRONT_SUBDOMAIN_ENABLED:true}
  security:
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:}

  telegram:
    api-base-url: https://api.telegram.org
    webhook-base-url: ${TELEGRAM_WEBHOOK_BASE_URL:}
    payment-poll-interval-ms: 10000
    payment-poll-initial-delay-ms: 10000

  push:
    dashboard-base-url: ${PUSH_DASHBOARD_BASE_URL:}
    internal-secret: ${PUSH_INTERNAL_SECRET:}

  facebook:
    app-id: ${FACEBOOK_APP_ID:2213406572840514}
    app-secret: ${FACEBOOK_APP_SECRET:89267cfc5597509ef386d3bd59b10090}
    redirect-uri: ${FACEBOOK_OAUTH_REDIRECT_URI:https://oxford-jailbreak-entrust.ngrok-free.dev/api/v1/social/facebook/oauth/callback}
    frontend-result-url: ${FACEBOOK_FRONTEND_RESULT_URL:http://localhost:3000/business/facebook}
    webhook-verify-token: ${FACEBOOK_WEBHOOK_VERIFY_TOKEN:fluxibiz_verify_token}

  bakong:
    base-url: https://api-bakong.nbc.gov.kh
    timeout: 8s

  public-api:
    base-url: ${SERVER_URL:http://localhost:8080}

  aba-payway:
    enabled: false
    base-url: https://checkout-sandbox.payway.com.kh
    merchant-id: ${ABA_MERCHANT_ID:}
    api-key: ${ABA_API_KEY:}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket:
    assets: fluxibix
    # Migration uploads are a shop's whole price list. They are read back only
    # by the import that owns them, never linked to, so they are kept out of
    # the asset bucket whose objects are served straight to browsers.
    imports: fluxibiz-imports
