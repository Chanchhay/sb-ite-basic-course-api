plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'co.istad'
version = '0.0.1-SNAPSHOT'
description = 'ite-sb-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// The hand-written SQL in database/ ships inside the jar. The Docker image
// holds the jar and nothing else, so scripts left in the repository would not
// exist in the container to be run — which is why SchemaScriptRunner looks for
// them on the classpath rather than on disk. They stay in database/ as the one
// source of truth; this only copies them.
processResources {
    from('database') {
        into 'db/migration'
        include '*.sql'
    }
}

dependencies {
    implementation 'io.minio:minio:9.0.3'

    // Reading the CSV and XLSX files a shop migrates in from its old system.
    // Neither format is something to parse by hand: a quoted comma or a date
    // cell that is really a number would each quietly corrupt a catalogue.
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    //bakong
    implementation 'kh.gov.nbc.bakong_khqr:sdk-java:1.0.0.17'

    //keycloak admin
    implementation 'org.keycloak:keycloak-admin-client:26.0.10'

    //scalar
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
